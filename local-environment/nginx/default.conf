server {
    listen 80;
    server_name _;

    # LocalStack の Lambda Function URL へプロキシ
    location / {
        # LocalStack が返す CORS ヘッダーを除去して重複を防ぐ
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        # CORS 設定 (always を付けないと 4xx/5xx でヘッダーが消える)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # OPTIONS プリフライトリクエストは即座に返す
        # ※ nginx の if ブロックは親の add_header を継承しないため、ここで再定義する
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        resolver 127.0.0.11 valid=10s;
        set $upstream http://data-collector-localstack:4566;
        proxy_pass $upstream;
        proxy_set_header Host lhvogxjivpbgylslgr8nrgiaqdqx5ly9.lambda-url.ap-northeast-1.localhost.localstack.cloud:4566;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin / Referer ヘッダーを除去して LocalStack の CORS チェックを回避
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 30s;
    }
}

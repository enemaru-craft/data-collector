version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: data-collector-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=apigateway,lambda,dynamodb,sts,iam,s3
      - DEBUG=0
      - AWS_DEFAULT_REGION=ap-northeast-1
      - DEFAULT_REGION=ap-northeast-1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "awslocal", "sts", "get-caller-identity"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:15
    container_name: data-collector-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: stg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./certs:/certs
    command: >-
      bash -c "
        if [ ! -f /certs/server.key ]; then
          mkdir -p /certs;
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -keyout /certs/server.key -out /certs/server.crt -subj '/CN=postgres' -days 365;
          chmod 600 /certs/server.key;
          chown postgres:postgres /certs/server.key /certs/server.crt;
        fi;
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
      "
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: data-collector-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test:
        ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -n || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # MQTT → Lambda ブリッジ (Mosquitto publish を受けて Lambda を invoke)
  mqtt-bridge:
    build:
      context: ./mqtt-bridge
      dockerfile: Dockerfile
    container_name: data-collector-mqtt-bridge
    depends_on:
      localstack:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=register/power
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=stg
      - DYNAMODB_TABLE=tmp_table
    restart: unless-stopped

  # Lambda リバースプロキシ (固定URL http://localhost:8080 → Lambda Function URL)
  nginx:
    image: nginx:alpine
    container_name: data-collector-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  localstack-data:
